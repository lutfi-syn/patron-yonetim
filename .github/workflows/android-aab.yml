name: Build Android AAB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci || npm install
      - run: npx expo prebuild --platform android --no-install
      - name: Fix Gradle Toolchain Resolver
        run: |
          node -e '
            const fs = require("fs");
            const settingsPath = "node_modules/@react-native/gradle-plugin/settings.gradle.kts";
            if (fs.existsSync(settingsPath)) {
              let content = fs.readFileSync(settingsPath, "utf8");
              content = content.replace(/.*foojay-resolver-convention.*/g, "// $&");
              fs.writeFileSync(settingsPath, content, "utf8");
            }
            const propsPath = "android/gradle.properties";
            if (fs.existsSync(propsPath)) {
              let props = fs.readFileSync(propsPath, "utf8");
              if (!props.includes("org.gradle.java.installations.auto-download")) {
                props += "\norg.gradle.java.installations.auto-download=false\n";
                fs.writeFileSync(propsPath, props, "utf8");
              }
            }
          '
      - name: Decode and Verify Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Eksik secret var: KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS ve RELEASE_KEY_PASSWORD dolu olmali."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "${{ github.workspace }}/android/app/release.keystore"
          ls -lh "${{ github.workspace }}/android/app/release.keystore"
          keytool -list -v -keystore "${{ github.workspace }}/android/app/release.keystore" -alias "$RELEASE_KEY_ALIAS" -storepass "$RELEASE_KEYSTORE_PASSWORD" -keypass "$RELEASE_KEY_PASSWORD" | grep -E "Alias name|SHA1"
      - name: Configure Release Signing in build.gradle
        run: node scripts/patch-gradle.js
      - name: Build Signed Release AAB
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
          RELEASE_STORE_FILE: "${{ github.workspace }}/android/app/release.keystore"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: patron-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
