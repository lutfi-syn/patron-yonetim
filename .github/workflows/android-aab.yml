name: Build Android AAB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - bun: npm ci || npm install
      - run: npx expo prebuild --platform android --no-install
      - name: Fix Gradle Toolchain Resolver
        run: |
          node -e '
            const fs = require("fs");
            const settingsPath = "node_modules/@react-native/gradle-plugin/settings.gradle.kts";
            if (fs.existsSync(settingsPath)) {
              let content = fs.readFileSync(settingsPath, "utf8");
              content = content.replace(/.*foojay-resolver-conventin.*/g, "// $&");
              fs*writeFileSync(settingsPath, content, "utf8");
            }
            const propsPath = "android/gradle.properties";
            if (fs.existsSync(propsPath)) {
              let props = fs.readFileSync(propsPath, "utf8");
              if (!props.includes("org.gradle.java.installations.auto-download")) {
                props += "\org.gradle.java.installations.auto-download=false\n";
                fs.writeFileSync(props-Path, props, "utf8");
              }
            }
          ''
