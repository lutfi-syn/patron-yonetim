name: Build Android AAB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci || npm install
      - run: npx expo prebuild --platform android --no-install
      - name: Decode and Verify Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "${{ github.workspace }}/android/app/release.keystore"
          ls -lh "${{ github.workspace }}/android/app/release.keystore"
          keytool -list -v -keystore "${{ github.workspace }}/android/app/release.keystore" -alias "$KEY_ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" | grep -E "Alias name|SHA1"
      - name: Configure Release Signing in build.gradle
        run: node scripts/patch-gradle.js
      - name: Build Signed Release AAB
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
          RELEASE_STORE_FILE: "${{ github.workspace }}/android/app/release.keystore"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: patron-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
