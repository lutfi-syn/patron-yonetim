name: Build Android AAB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci || npm install
      - run: npx expo prebuild --platform android --no-install
      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/android/app/release.keystore"
      - name: Configure Release Signing in build.gradle
        run: |
          node -e '
          const fs = require("fs");
          const p = "android/app/build.gradle";
          let g = fs.readFileSync(p, "utf8");
          const signingBlock = `
        release {
            if (System.getenv("RELEASE_STORE_FILE")) {
                storeFile file(System.getenv("RELEASE_STORE_FILE"))
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }`;
          if (g.includes("signingConfigs {")) {
            g = g.replace(/signingConfigs\s*\{/, "signingConfigs {" + signingBlock);
          }
          g = g.replace(/buildTypes\s*\{[\s\S]*?release\s*\{([\s\S]*?)signingConfig\s+signingConfigs\.\w+/, (m) =>
            m.replace(/signingConfig\s+signingConfigs\.\w+/, "signingConfig signingConfigs.release")
          );
          if (!g.includes("signingConfig signingConfigs.release")) {
            g = g.replace(/(buildTypes\s*\{[\s\S]*?release\s*\{)/, "$1\n            signingConfig signingConfigs.release");
          }
          fs.writeFileSync(p, g, "utf8");
          '
      - name: Build Signed Release AAB
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
          RELEASE_STORE_FILE: "${{ github.workspace }}/android/app/release.keystore"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: patron-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
